# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Microsoft Xiaoice's 靶场手记
subtitle: '证据优先 · 授权靶场的 Web 漏洞验证与复现'
description: 'Microsoft Xiaoice 的授权靶场 Writeup 站：CTF / SRC / Web 漏洞复现。结论先行、证据分级、可复现留证。'
keywords: 'Web安全,CTF,Writeup,SRC,漏洞复现,渗透测试,靶场'
author: Microsoft Xiaoice 
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://docs.lvlv.asia
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: anzhiyu

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''

# Search (hexo-generator-searchdb)
search:
  path: search.xml
  field: post
  content: true
  format: html

# envelope_comment（留言板 /comments/，由 hexo-butterfly-envelope 生成）
envelope_comment:
  enable: true
  custom_pic:
    cover: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/violet.jpg
    line: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/line.png
    beforeimg: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/before.png
    afterimg: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/after.png
  message:
    - 有想复现的漏洞？
    - 有想讨论的 Writeup？
    - 有对证据链的疑问？
    - 授权靶场里踩到的坑，也可以留言。
  bottom: 仅记录授权环境下的靶场研究，不接收未授权目标。
  height:
  path:
  front_matter:
    title: 留言板
    comments: true
    top_img: false
    type: envelope

sitemap:
  path: sitemap.xml
  rel: true
  tags: true
  categories: true